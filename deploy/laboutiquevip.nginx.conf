# Non-www to www redirect (HTTPS)
server {
    listen 443 ssl http2;
    server_name laboutiquevip.net;

    ssl_certificate /etc/letsencrypt/live/laboutiquevip.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laboutiquevip.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://www.laboutiquevip.net$request_uri;
    }
}

# Main site www
server {
    listen 443 ssl http2;
    server_name www.laboutiquevip.net;

    ssl_certificate /etc/letsencrypt/live/laboutiquevip.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laboutiquevip.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/apps/trystlike/repo/dist;
    index index.html;
    client_max_body_size 500m;
    keepalive_timeout 65;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://accounts.laboutiquevip.net https://api.laboutiquevip.net; worker-src 'self' blob:; frame-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; frame-ancestors 'self';" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8787/sitemap.xml;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photo proxies — long edge cache at Cloudflare
    location ^~ /api/r2-photo/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/eros-photo {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ^~ /api/tryst-photo {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Hashed Vite assets — 1 year immutable
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|svg|ico|png|jpg|jpeg|gif|webp|avif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA shell — short CF edge cache, always revalidate in browser
    location / {
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://accounts.laboutiquevip.net https://api.laboutiquevip.net; worker-src 'self' blob:; frame-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; frame-ancestors 'self';" always;
        try_files $uri $uri/ /index.html;
    }
}

# HTTP redirects
server {
    listen 80;
    server_name laboutiquevip.net www.laboutiquevip.net;
    return 301 https://www.laboutiquevip.net$request_uri;
}
