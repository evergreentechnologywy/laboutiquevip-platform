server {
    listen 80;
    listen [::]:80;
    server_name laboutiquevip.net;
    return 301 https://www.laboutiquevip.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.laboutiquevip.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://www.laboutiquevip.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.laboutiquevip.net;

    ssl_certificate /etc/letsencrypt/live/www.laboutiquevip.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.laboutiquevip.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/apps/trystlike/repo/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
