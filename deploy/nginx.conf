server {
    listen 80;
    listen [::]:80;
    server_name laboutiquevip.net;
    return 301 https://www.laboutiquevip.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.laboutiquevip.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://www.laboutiquevip.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.laboutiquevip.net;

    ssl_certificate /etc/letsencrypt/live/www.laboutiquevip.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.laboutiquevip.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/apps/trystlike/repo/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://accounts.laboutiquevip.net https://api.laboutiquevip.net; worker-src 'self' blob:; frame-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; frame-ancestors 'self';" always;


    client_max_body_size 25m;
    keepalive_timeout 65;
    keepalive_requests 1000;

    location = /api/v1/search/providers {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        proxy_cache laboutiquevip_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location ~ ^/api/r2-photo/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_cache laboutiquevip_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 24h;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    location ~* \.(?:js|css|svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://accounts.laboutiquevip.net https://api.laboutiquevip.net; worker-src 'self' blob:; frame-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; frame-ancestors 'self';" always;
        try_files $uri =404;
    }

    location /uploads/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://accounts.laboutiquevip.net https://api.laboutiquevip.net; worker-src 'self' blob:; frame-src 'self' https://*.clerk.com https://clerk.laboutiquevip.net https://challenges.cloudflare.com; frame-ancestors 'self';" always;
        try_files $uri $uri/ /index.html;
    }
}
